<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veda Sahithi | Portfolio</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
      background: #fff;
    }

    iframe {
      width: 100%;
      border: none;
      display: block;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <!-- HOME -->
  <iframe src="index.html" scrolling="no"></iframe>

  <!-- PROJECTS -->
  <iframe src="projects.html" scrolling="no"></iframe>

  <!-- RESUME -->
  <iframe src="resume.html" scrolling="no"></iframe>

  <!-- CONTACT -->
  <iframe src="contact.html" scrolling="no"></iframe>

  <script>
    function resizeIframes() {
      const iframes = document.querySelectorAll("iframe");

      iframes.forEach(iframe => {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          if (doc) {
            iframe.style.height = doc.documentElement.scrollHeight + "px";
          }
        } catch (e) {
          console.warn("Could not resize iframe:", e);
        }
      });
    }

    // Resize after load
    window.addEventListener("load", () => {
      resizeIframes();
      setTimeout(resizeIframes, 500);
      setTimeout(resizeIframes, 1500);
    });

    // Resize on window resize
    window.addEventListener("resize", resizeIframes);
  </script>

</body>
</html>
